name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linters
        run: pre-commit run --all-files

      - name: Run tests
        env:
          AUTH_SECRET_KEY: ci-synthetic-secret-key
          AUTH_ADMIN_PASSWORD: ci-synthetic-admin-pass-123456
          AUTH_EDITOR_PASSWORD: ci-synthetic-editor-pass-123456
          AUTH_VIEWER_USERNAME: viewer
          AUTH_VIEWER_PASSWORD: ci-synthetic-viewer-pass-123456
        run: pytest src/
