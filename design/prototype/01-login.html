<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — СибАДИ Competitions</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem("sc-proto-theme") === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (error) {
                /* localStorage недоступен — остаётся светлая тема */
            }
            document.addEventListener("DOMContentLoaded", function () {
                var buttons = document.querySelectorAll("[data-theme-toggle]");
                for (var i = 0; i < buttons.length; i++) {
                    buttons[i].addEventListener("click", function () {
                        var root = document.documentElement;
                        var dark = root.getAttribute("data-theme") === "dark";
                        if (dark) {
                            root.removeAttribute("data-theme");
                        } else {
                            root.setAttribute("data-theme", "dark");
                        }
                        try {
                            localStorage.setItem("sc-proto-theme", dark ? "light" : "dark");
                        } catch (error) {
                            /* ничего не делаем */
                        }
                    });
                }
            });
        })();
    </script>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="prototype.css">
</head>
<body>
    <div class="fixed-corner">
        <button class="icon-btn icon-btn--light" type="button" data-theme-toggle aria-label="Переключить тему" title="Переключить тему">
            <svg class="i-moon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.7 9.9A5.9 5.9 0 0 1 6.1 2.3a5.9 5.9 0 1 0 7.6 7.6z"/></svg>
            <svg class="i-sun" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/></svg>
        </button>
    </div>

    <div class="login-wrap">
        <main class="login-card">
            <div class="login-brand">
                <span class="brand__mark">С</span>
                <span>СибАДИ Competitions</span>
            </div>

            <div class="card">
                <div class="card__body">
                    <h1 class="card__title mb-1">Вход в систему</h1>
                    <p class="card__sub mb-4">Учёт участия студентов в спортивных соревнованиях</p>

                    <form>
                        <div class="field">
                            <label class="label" for="username">Логин<span class="req">*</span></label>
                            <input class="input" id="username" name="username" type="text" autocomplete="username" placeholder="например, editor1">
                        </div>

                        <div class="field">
                            <label class="label" for="password">Пароль<span class="req">*</span></label>
                            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
                        </div>

                        <button class="btn btn--primary btn--block" type="submit">Войти</button>
                    </form>
                </div>
            </div>

            <div class="login-foot">
                СибАДИ · дизайн-прототип, страница 01 · <a href="index.html">к обложке прототипа</a>
            </div>
        </main>
    </div>
</body>
</html>
