server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dokin-app.online www.dokin-app.online 188.127.237.171 188.127.237.171.sslip.io;

    ssl_certificate /etc/letsencrypt/live/dokin-app.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokin-app.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/competitions.access.log;
    error_log /var/log/nginx/competitions.error.log;

    # Лимит вложений в приложении — 5 МБ; даём запас на multipart-обёртку,
    # иначе nginx режет запрос своим дефолтом (1 МБ) с 413 до Sanic.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dokin-app.online www.dokin-app.online;
    return 301 https://$host$request_uri;
}
